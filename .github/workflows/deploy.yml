name: Build and deploy showcase

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily, so a repo that goes live (or goes dark) shows up without a push.
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Never let a scheduled run and a push run race to publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Keyed so a run always starts from the most recent manifest, then saves
      # its own. Screenshots whose repo has not been pushed to are reused.
      - name: Restore screenshot cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: shots-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            shots-${{ runner.os }}-

      - name: Discover projects and capture screenshots
        run: npm run fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
